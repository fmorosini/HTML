<script type="application/javascript">

/* ===========================================================
   ARCHIVO GENERADO — no editar a mano.
   Se genera desde templates/mapa.html con scripts/build.py.
   Los 5 mapas comparten este mismo código; sólo cambian el
   GeoJSON, el centro, el zoom y el título.
   =========================================================== */

{

	var mymap;

}

function invertir(arreglo){
	var arreglo_invertido = [];
	arreglo_invertido[1] = arreglo[0];
	arreglo_invertido[0] = arreglo[1];

	return arreglo_invertido;
}




function cargarDatosEnMapa(){

	console.log("carga datos")

	mymap.eachLayer(function(l){if(l.options.layer != 'capabaseargenmap') mymap.removeLayer(l)}) //Borra todas las capas y marcadores menos la capa base

	var cluster = L.markerClusterGroup({disableClusteringAtZoom: 18});

	mymap.addLayer(cluster);

		L.control.locate({
			locateOptions: {
				showCompass: true,
				drawCircle: true,
				drawMarker: true,
				enableHighAccuracy: true
			},
			strings: {
				title: "Usted está aquí!"}

		}).addTo(mymap);


	var rootUrl = './json/junin.geojson';
	var lookupUrl = './json/especies-lookup.json';

	console.log("pasa por acá")

	// El índice de especies completa lo que al GeoJSON le falte (junin no trae
	// `imagen` ni `thumbnail`) y corrige los slugs viejos del dato de campo.
	$.when(
		$.ajax({url: rootUrl, dataType: 'json'}),
		$.ajax({url: lookupUrl, dataType: 'json'})
	).done(function(geo, lookup){
		despliegaDatos(geo[0], cluster, lookup[0]);
	});

}




function normalizarNombre(nombre){
	return (nombre || "")
		.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
		.toLowerCase()
		.replace(/[^a-z ]/g, " ")
		.replace(/\s+/g, " ")
		.trim();
}

// Busca por nombre científico completo y, si no aparece, por "género especie"
// (para tolerar variedades y cultivares del dato de campo).
function buscarFicha(nombreCientifico, lookup){
	if(!lookup){ return null; }
	var n = normalizarNombre(nombreCientifico);
	if(lookup[n]){ return lookup[n]; }
	var toks = n.split(" ");
	if(toks.length >= 2){
		var generoEspecie = toks[0] + " " + toks[1];
		if(lookup[generoEspecie]){ return lookup[generoEspecie]; }
	}
	return null;
}

// El servidor de íconos distingue mayúsculas y el dato de campo trae un nombre
// que no coincide con el archivo publicado. Corregir acá hasta que se arregle
// en el origen (afecta a Cupressus sempervirens en todos los mapas).
var CORRECCION_ICONO = {
	"Cupressus sempervirens.gif": "CUPRESSUS SEMPERVIRENS.gif"
};

// Ícono por especie: los .gif viven en /iconos/<magnitud>/ en el sitio viejo.
function iconoArbol(imagen, magnitud){
	var anclas = {1: 40, 2: 30, 3: 20};
	if(!imagen || !anclas[magnitud]){ return new L.Icon.Default(); }
	var archivo = CORRECCION_ICONO[imagen] || imagen;
	return L.icon({
		iconUrl: encodeURI('https://www.arbolesurbanos.com.ar/iconos/' + magnitud + '/' + archivo),
		iconAnchor: [anclas[magnitud], 0]
	});
}

function despliegaDatos(data, cluster, lookup)
{
	console.log(data)

	for(var i = 0; i < data.features.length; i++){

			var props = data.features[i].properties;
			var ficha = buscarFicha(props.nombrecientifico, lookup);

			// Manda lo que traiga el GeoJSON; el índice sólo rellena huecos.
			var imagen    = (props.imagen || (ficha && ficha.imagen) || "").trim();
			var thumbnail = (props.thumbnail || (ficha && ficha.thumbnail) || "").trim();
			var fichaUrl  = (ficha && ficha.slug) ? 'especies/' + ficha.slug + '.html' : null;

			var m = new L.marker(invertir(data.features[i].geometry.coordinates), {icon: iconoArbol(imagen, props.magnitud), title: props.nombrevulgar});

			var html_popup = "<div class='card'>";

			if(thumbnail){

				var img = "<img class='img-fluid' style='max-width: " + (fichaUrl ? "80%" : "250px") + "' src='" + encodeURI("https://www.arbolesurbanos.com.ar/" + thumbnail.replace(/^\//, "")) + "' />";

				html_popup += " <div class='card-header'><center>" + (fichaUrl ? "<a href='" + fichaUrl + "' target='_top'>" + img + "</a>" : img) + "</center></div>";

			}

			html_popup += " <div class='card-body'>";
			html_popup += "       <p><h5><center><strong>" + props.nombrevulgar + "</strong></center></h5>";
			html_popup += "         <hr />";
			html_popup += "         <h5><strong>Nombre científico:</strong> " + props.nombrecientifico + "</h5>";
			html_popup += "         <h5><strong>Tipo:</strong> " + props.tipo + "</h5>";
			html_popup += "         <h5><strong>Follaje:</strong> " + props.follaje + "</h5>";
			html_popup += "		  <h5><strong>Magnitud:</strong> " + props.magnitud + "</h5>";

			if(fichaUrl){
				html_popup += "     <center><a href='" + fichaUrl + "' target='_top'>Ver ficha de la especie</a></center>";
			}

			html_popup += "     </p>";
			html_popup += "  </div>";

			html_popup += "</div>";

			var popup = L.responsivePopup({ autoPanPadding: [10,10] }).setContent(html_popup);

			m.bindPopup(popup);
			m.addTo(cluster)



		}
}



function inicio(){



	var container = L.DomUtil.get('mapid');
	if(container != null){
	container._leaflet_id = null;
	}

	mymap = L.map('mapid', {
		center: [-39.951791186889466,-71.06955823780463],
		zoom: 18
		});





	var base = new L.TileLayer.WMTS( "https://wms.ign.gob.ar/geoserver/capabaseargenmap/gwc/service/wmts" ,
		{
			layer: "capabaseargenmap",
			style: "normal",
			tilematrixSet: "EPSG:3857",
			format: "image/png",
			maxZoom: 21,
			attribution: "<a href='https://wms.ign.gob.ar/geoserver/capabaseargenmap/gwc/service/wmts?REQUEST=GetCapabilities'>WMTS IGN</a>"
		}
	);



	mymap.addLayer(base);


	console.log("antes de cargar data, en inicio")
	cargarDatosEnMapa();


}


</script>
</head>
<body onload="inicio();">


		<div id="mapid"></div>

</body>
