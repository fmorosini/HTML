<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
<script src="js/leaflet-tilelayer-wmts.js"></script>
<script type="application/javascript">

{

	var mymap;

}

function invertir(arreglo){
	var arreglo_invertido = [];
	arreglo_invertido[1] = arreglo[0];
	arreglo_invertido[0] = arreglo[1];

	return arreglo_invertido;
}




function cargarDatosEnMapa(){

	console.log("carga datos")

	mymap.eachLayer(function(l){if(l.options.layer != 'capabaseargenmap') mymap.removeLayer(l)}) //Borra todas las capas y marcadores menos la capa base

	var cluster = L.markerClusterGroup({disableClusteringAtZoom: 18});

	mymap.addLayer(cluster);

		L.control.locate({
			locateOptions: {
				showCompass: true,
				drawCircle: true,
				drawMarker: true,
				enableHighAccuracy: true
			},
			strings: {
				title: "Usted está aquí!"}

		}).addTo(mymap);


	var rootUrl = './json/junin.geojson';
	var lookupUrl = './json/especies-lookup.json';

	console.log("pasa por acá")

	// junin.geojson sólo trae nombre científico (sin url_ficha ni thumbnail),
	// así que cargamos también el índice de especies para resolver la ficha.
	$.when(
		$.ajax({url: rootUrl, dataType: 'json'}),
		$.ajax({url: lookupUrl, dataType: 'json'})
	).done(function(geo, lookup){
		despliegaDatos(geo[0], cluster, lookup[0]);
	});

}




function normalizarNombre(nombre){
	return (nombre || "")
		.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
		.toLowerCase()
		.replace(/[^a-z ]/g, " ")
		.replace(/\s+/g, " ")
		.trim();
}

// Busca la ficha por nombre científico completo y, si no aparece,
// por "género especie" (para tolerar variedades y cultivares).
function buscarFicha(nombreCientifico, lookup){
	if(!lookup){ return null; }
	var n = normalizarNombre(nombreCientifico);
	if(lookup[n]){ return lookup[n]; }
	var toks = n.split(" ");
	if(toks.length >= 2){
		var generoEspecie = toks[0] + " " + toks[1];
		if(lookup[generoEspecie]){ return lookup[generoEspecie]; }
	}
	return null;
}

function iconoPorMagnitud(magnitud){
	var tam = magnitud == 1 ? 24 : (magnitud == 2 ? 18 : 13);
	return L.divIcon({
		className: 'au-marcador',
		iconSize: [tam, tam],
		iconAnchor: [tam / 2, tam / 2]
	});
}

function despliegaDatos(data, cluster, lookup)
{
	console.log(data)

	for(var i = 0; i < data.features.length; i++){

			var props = data.features[i].properties;

			var m = new L.marker(invertir(data.features[i].geometry.coordinates), {icon: iconoPorMagnitud(props.magnitud), title: props.nombrevulgar});

			var ficha = buscarFicha(props.nombrecientifico, lookup);

			var html_popup = "<div class='card'>";

			if(ficha && ficha.thumb){

				html_popup += " <div class='card-header'><center><a href='especies/" + ficha.slug + ".html' target='_top'><img class='img-fluid' style='max-width: 80%' src='" + encodeURI("assets/img/especies/" + ficha.thumb) + "' /></a></center></div>";

			}

			html_popup += " <div class='card-body'>";
			html_popup += "       <p><h5><center><strong>" + props.nombrevulgar + "</strong></center></h5>";
			html_popup += "         <hr />";
			html_popup += "         <h5><strong>Nombre científico:</strong> " + props.nombrecientifico + "</h5>";
			html_popup += "         <h5><strong>Tipo:</strong> " + props.tipo + "</h5>";
			html_popup += "         <h5><strong>Follaje:</strong> " + props.follaje + "</h5>";
			html_popup += "		  <h5><strong>Magnitud:</strong> " + props.magnitud + "</h5>";

			if(ficha){
				html_popup += "     <center><a href='especies/" + ficha.slug + ".html' target='_top'>Ver ficha de la especie</a></center>";
			}

			html_popup += "     </p>";
			html_popup += "  </div>";

			html_popup += "</div>";

			var popup = L.responsivePopup({ autoPanPadding: [10,10] }).setContent(html_popup);

			m.bindPopup(popup);
			m.addTo(cluster)



		}
}



function inicio(){



	var container = L.DomUtil.get('mapid');
	if(container != null){
	container._leaflet_id = null;
	}

	mymap = L.map('mapid', {
		center: [-39.951791186889466, -71.06955823780463],
		zoom: 18
		});





	var base = new L.TileLayer.WMTS( "https://wms.ign.gob.ar/geoserver/capabaseargenmap/gwc/service/wmts" ,
		{
			layer: "capabaseargenmap",
			style: "normal",
			tilematrixSet: "EPSG:3857",
			format: "image/png",
			maxZoom: 21,
			attribution: "<a href='https://wms.ign.gob.ar/geoserver/capabaseargenmap/gwc/service/wmts?REQUEST=GetCapabilities'>WMTS IGN</a>"
		}
	);



	mymap.addLayer(base);


	console.log("antes de cargar data, en inicio")
	cargarDatosEnMapa();


}


</script>
</head>
<body onload="inicio();">


		<div id="mapid"></div>

</body>
